version: '3.8'

services:
  app:
    build: .
    container_name: laravel_app
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: enterprise
      DB_USERNAME: root
      DB_PASSWORD: root

# Only define MySQL if you want new container
# Otherwise remove this section and point to your existing MySQL container
# mysql:
